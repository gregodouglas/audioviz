[workspace]
resolver = "2"
members = ["crates/audio", "crates/analysis", "crates/metadata", "crates/app", "xtask"]
default-members = ["crates/audio", "crates/analysis", "crates/metadata", "crates/app"]

[workspace.package]
version = "0.4.51"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ringbuf = "0.5"
crossbeam-channel = "0.5"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.34"
realfft = "3"
wgpu = "30"
winit = "0.30"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", features = ["winit"] }
egui-winit = "0.37"
pollster = "1"
wasapi = "0.26"
sysinfo = "0.39"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "7"
windows = "0.62"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
