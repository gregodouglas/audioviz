[package]
name = "audioviz"
description = "A spacey, line-based music visualizer for whatever is playing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "audioviz"
path = "src/main.rs"

[dependencies]
audioviz-audio = { path = "../audio" }
audioviz-analysis = { path = "../analysis" }
audioviz-metadata = { path = "../metadata" }
anyhow.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bytemuck.workspace = true
glam.workspace = true
wgpu.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
image.workspace = true
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
# Only for attaching to the parent console so `--version` / `--help` can print
# from a windows-subsystem binary.
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_Networking_WinHttp", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
