ShortDescription: A music visualizer for whatever Windows is playing (Spotify first)
Description: |-
  audioviz listens to what Windows is playing (Spotify by default, per-process loopback)
  and draws it: 30 visuals (phosphor scope, flow-field ribbons, a ray-traced black hole,
  jellyfish, the Sigil and more) layered into scenes, with effects and palettes moved by
  the music. Native Rust + wgpu, no telemetry; the only network request is an update
  check you start yourself. Written by Claude Code under the author's direction.
  Settings live in %APPDATA%\audioviz.
