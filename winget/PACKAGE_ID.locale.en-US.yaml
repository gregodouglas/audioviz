ShortDescription: A spacey, line-based music visualizer for whatever is playing (Spotify first)
Description: |-
  audioviz listens to what Windows is playing (Spotify by default, per-process loopback)
  and draws it: a phosphor XY oscilloscope, chroma-steered flow-field ribbons, and a
  gravitationally lensed starfield with a now-playing title overlay. Native Rust + wgpu,
  no telemetry, no network access. Settings live in %APPDATA%\audioviz.
